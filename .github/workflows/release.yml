name: Release

# Pushing a tag like v0.1.0 (or running this by hand with a version) attaches the packages to a GitHub
# release as tarballs, so they install without npm: see docs/INSTALL.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v (e.g. 0.1.0); the tag v<version> is created on the current commit'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: node scripts/pack-release.mjs "${{ steps.version.outputs.version }}" release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" release/* \
            --target "$GITHUB_SHA" --generate-notes
