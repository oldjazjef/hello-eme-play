<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>@hello-eme/play-editor: standalone example</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}
			main {
				max-width: 64rem;
				margin: 0 auto;
				padding: 1rem;
			}
			pre {
				overflow: auto;
				max-height: 16rem;
				padding: 0.75rem;
				border: 1px solid #8884;
				border-radius: 0.5rem;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>The configuration editor, without a CMS</h1>
			<p>
				One script and one call. The same editor runs inside Payload
				(<code>@hello-eme/play-payload</code>). Build first: <code>npm run build</code>.
			</p>
			<div id="editor"></div>
			<h2>The JSON the page gets</h2>
			<pre id="json">{}</pre>
		</main>
		<script src="../../packages/editor/dist/editor.iife.js"></script>
		<script>
			const output = document.getElementById('json');
			window.editor = PlayEditor.mount(document.getElementById('editor'), {
				lang: 'en',
				// The preview page plays every change (it loads the game with data-preview).
				previewUrl: new URL('preview.html', location.href).href,
				referenceUrl: 'https://github.com/oldjazjef/hello-eme-play/blob/main/docs/REFERENCE.md',
				onChange: (json) => {
					output.textContent = JSON.stringify(json, null, 2);
				}
			});
		</script>
	</body>
</html>
